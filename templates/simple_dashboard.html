<!DOCTYPE html>
<html>
<head>
    <title>SOC Alert System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center"> SOCAlert Detection System</h1>
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">System Status</div>
                    <div class="card-body">
                        <p>CPU: <span id="cpu">Loading...</span></p>
                        <p>Memory: <span id="memory">Loading...</span></p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Recent Alerts</div>
                    <div class="card-body">
                        <div id="alerts">Loading alerts...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Simple refresh function
        function refreshData() {
            fetch('/api/system-health')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('cpu').textContent = data.cpu + '%';
                    document.getElementById('memory').textContent = data.memory + '%';
                });
            
            fetch('/api/alerts')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('alerts').innerHTML = data.length + ' alerts detected';
                });
        }
        
        setInterval(refreshData, 5000);
        refreshData();
    </script>
</body>
</html>
